name: Images

# Builds the production image of every web app (apps/*) and API (services/*)
# and pushes it as <registry>/<app>:<commit>, what the Kubernetes overlays of
# deploy/staging and deploy/prod run. The registry is the IMAGE_REGISTRY
# repository variable, or ghcr.io/<owner>/<repository> without it; set
# REGISTRY_USERNAME and REGISTRY_PASSWORD secrets for a registry other than
# GHCR.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Find the apps
        id: apps
        run: |
          paths=""
          for dockerfile in apps/*/Dockerfile services/*/Dockerfile; do
            [ -e "$dockerfile" ] && paths="$paths $(dirname "$dockerfile")"
          done
          echo "paths=${paths# }" >> "$GITHUB_OUTPUT"
          registry="${{ vars.IMAGE_REGISTRY }}"
          registry="${registry:-ghcr.io/${{ github.repository }}}"
          echo "registry=$(echo "$registry" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        if: steps.apps.outputs.paths != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.IMAGE_REGISTRY_HOST || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.apps.outputs.paths != ''
        env:
          REGISTRY: ${{ steps.apps.outputs.registry }}
          PATHS: ${{ steps.apps.outputs.paths }}
        run: |
          for path in $PATHS; do
            image="$REGISTRY/$(basename "$path"):$GITHUB_SHA"
            case "$path" in
              # A web app builds from the root, which holds the Bun workspace.
              apps/*) docker build -f "$path/Dockerfile" -t "$image" . ;;
              # So does an API, with the Cargo workspace and the crates it
              # shares. One generated before crates/ existed has no
              # Dockerfile.dockerignore, and builds from its own folder.
              services/*)
                if [ -e "$path/Dockerfile.dockerignore" ]; then
                  docker build -f "$path/Dockerfile" -t "$image" .
                else
                  docker build -t "$image" "$path"
                fi
                ;;
            esac
            docker push "$image"
            echo "Pushed $image"
          done
