name: Templates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # zitadel-app.test.ts checks its requests against the ZITADEL release the
      # auth stack runs.
      - name: Download the ZITADEL API definitions
        run: |
          version="$(grep '^ZITADEL_VERSION=' apps/auth-server/.env.example | cut -d= -f2)"
          dir="$RUNNER_TEMP/zitadel-proto"
          mkdir -p "$dir"
          for file in management.proto admin.proto app.proto user.proto project.proto member.proto object.proto \
            user/v2/user_service.proto user/v2/user.proto user/v2/email.proto user/v2/password.proto \
            org/v2/org_service.proto org/v2/org.proto org/v2/query.proto settings.proto; do
            mkdir -p "$dir/$(dirname "$file")"
            curl --fail --silent --show-error --location --output "$dir/$file" \
              "https://raw.githubusercontent.com/zitadel/zitadel/${version}/proto/zitadel/${file}"
          done
          echo "ZITADEL_PROTO_DIR=$dir" >> "$GITHUB_ENV"

      - name: Test the workspace scripts
        run: bun test scripts

      - name: Check the workspace
        run: bun run project:doctor

  web:
    name: ${{ matrix.template }} (demos ${{ matrix.demos }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: [tanstack, next]
        demos: [true, false]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the app
        run: moon generate ${{ matrix.template }} -- --name web --port 3000 ${{ !matrix.demos && '--no-include_demos' || '' }}

      - name: Check, test, and build the app
        run: moon run web:check web:test web:build

      - name: Build the production image
        run: moon run web:docker

  axum:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the API
        run: moon generate axum -- --name api --port 4000

      - name: Check and test the API
        run: moon run api:check api:test

      - name: Build the production image
        run: moon run api:docker

  # An API generated with --database, tested against the data project's
  # PostgreSQL: api:test starts it through data:up.
  axum-database:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the data project and the API
        run: |
          moon generate postgres -- --name data --port 5433
          moon generate axum -- --name api --port 4000 --database
          cp apps/api/.env.example apps/api/.env

      - name: Check and test the API
        run: moon run api:check api:test

      - name: Build the production image
        run: moon run api:docker

  # An API generated with --database --events: its outbox is tested against the
  # data project's PostgreSQL, and an event goes through the bus project's NATS.
  axum-events:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the data project, the bus, and the API
        run: |
          moon generate postgres -- --name data --port 5433
          moon generate bus -- --name bus --port 4222
          moon generate axum -- --name api --port 4000 --database --events
          cp apps/api/.env.example apps/api/.env

      - name: Check and test the API
        run: moon run api:check api:test

      - name: Build the production image
        run: moon run api:docker

  # The object store: its bucket is created and takes a signed request.
  storage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate and start the object store
        run: |
          moon generate storage -- --name storage --port 9000
          moon run storage:up

  # Runs deploy/ on the runner with certificates from a local authority, the
  # way deploy/README.md describes, and signs in through it.
  deploy:
    name: deploy (${{ matrix.template }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: [tanstack, next]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the apps to deploy
        run: |
          moon generate ${{ matrix.template }} -- --name web --port 3000
          moon generate axum -- --name api --port 4000
          bun install

      - name: Configure a local deployment
        run: |
          cp deploy/.env.example deploy/.env
          sed -i \
            -e 's/^AUTH_DOMAIN=.*/AUTH_DOMAIN=auth.localtest.me/' \
            -e 's/^APP_DOMAIN=.*/APP_DOMAIN=app.localtest.me/' \
            -e 's/^API_DOMAIN=.*/API_DOMAIN=api.localtest.me/' \
            -e 's/^ACME_EMAIL=.*/ACME_EMAIL=ops@localtest.me/' \
            -e 's/^WEB_APP=.*/WEB_APP=web/' \
            deploy/.env
          deploy/local-certs.sh

      - name: Deploy with setup
        env:
          COMPOSE_FILE: deploy/docker-compose.yml:deploy/docker-compose.local.yml
          NODE_EXTRA_CA_CERTS: deploy/.local/ca.pem
        run: bun run setup -- --deploy

      - name: Sign in through the deployed stack
        run: deploy/smoke-test.sh

      - name: Show the stack's logs
        if: failure()
        env:
          COMPOSE_FILE: deploy/docker-compose.yml:deploy/docker-compose.local.yml
        run: docker compose --env-file deploy/.env logs --tail 100 || true
