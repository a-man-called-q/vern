name: Templates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # zitadel-app.test.ts checks its requests against the ZITADEL release the
      # auth stack runs.
      - name: Download the ZITADEL API definitions
        run: |
          version="$(grep '^ZITADEL_VERSION=' apps/auth-server/.env.example | cut -d= -f2)"
          dir="$RUNNER_TEMP/zitadel-proto"
          mkdir -p "$dir"
          for file in management.proto app.proto; do
            curl --fail --silent --show-error --location --output "$dir/$file" \
              "https://raw.githubusercontent.com/zitadel/zitadel/${version}/proto/zitadel/${file}"
          done
          echo "ZITADEL_PROTO_DIR=$dir" >> "$GITHUB_ENV"

      - name: Test the workspace scripts
        run: bun test scripts

      - name: Check the workspace
        run: bun run project:doctor

  web:
    name: ${{ matrix.template }} (demos ${{ matrix.demos }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: [tanstack, next]
        demos: [true, false]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the app
        run: moon generate ${{ matrix.template }} -- --name web --port 3000 ${{ !matrix.demos && '--no-include_demos' || '' }}

      - name: Check, test, and build the app
        run: moon run web:check web:test web:build

  axum:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the API
        run: moon generate axum -- --name api --port 4000

      - name: Check and test the API
        run: moon run api:check api:test
