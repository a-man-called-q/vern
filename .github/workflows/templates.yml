name: Templates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A project that chose how its environments run (`bun run project:stack`)
  # holds only the files of those ways, so the jobs that deploy one run only
  # where the project can. The template itself has made no choice and runs all.
  ways:
    runs-on: ubuntu-24.04
    outputs:
      compose: ${{ steps.find.outputs.compose }}
      kubernetes: ${{ steps.find.outputs.kubernetes }}
      kind: ${{ steps.find.outputs.kind }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Find how the local environment runs
        id: find
        run: |
          local="$(jq -r '.environments.local // "any"' .vern/config.json 2>/dev/null || echo any)"
          answer() { if [ "$2" = true ] && [ -e "$3" ]; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          case "$local" in any | compose) rehearses=true ;; *) rehearses=false ;; esac
          answer compose "$rehearses" deploy/compose/docker-compose.yml
          answer kubernetes true deploy/base/identity/kustomization.yaml
          case "$local" in any | kubernetes) rehearses=true ;; *) rehearses=false ;; esac
          answer kind "$rehearses" deploy/local/kind.yaml

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # zitadel-app.test.ts checks its requests against the ZITADEL release the
      # auth stack runs.
      - name: Download the ZITADEL API definitions
        run: |
          version="$(grep '^ZITADEL_VERSION=' deploy/dev/auth-server/.env.example | cut -d= -f2)"
          dir="$RUNNER_TEMP/zitadel-proto"
          mkdir -p "$dir"
          for file in management.proto admin.proto app.proto user.proto project.proto member.proto object.proto \
            user/v2/user_service.proto user/v2/user.proto user/v2/email.proto user/v2/password.proto \
            org/v2/org_service.proto org/v2/org.proto org/v2/query.proto settings.proto; do
            mkdir -p "$dir/$(dirname "$file")"
            curl --fail --silent --show-error --location --output "$dir/$file" \
              "https://raw.githubusercontent.com/zitadel/zitadel/${version}/proto/zitadel/${file}"
          done
          echo "ZITADEL_PROTO_DIR=$dir" >> "$GITHUB_ENV"

      - name: Test the workspace scripts
        run: bun test scripts

      - name: Check the workspace
        run: bun run project:doctor

  web:
    name: ${{ matrix.template }} (demos ${{ matrix.demos }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: [tanstack, next]
        demos: [true, false]
    steps:
      # The whole history: on a pull request moon compares with the base branch,
      # which a shallow checkout does not have.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the app
        run: moon generate ${{ matrix.template }} -- --name web --port 3000 ${{ !matrix.demos && '--no-include_demos' || '' }}

      - name: Check, test, and build the app
        run: moon run web:check web:test web:build

      - name: Build the production image
        run: moon run web:docker

  # What the generated apps and APIs share: the Bun packages in packages/ and
  # the Cargo crates in crates/. The crates' tests that need PostgreSQL or NATS
  # run in the axum-database and axum-events jobs, with a generated API.
  shared:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # `moon run` compares against the base branch.
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check and test the shared packages
        run: moon run ui:check web-auth:check web-auth:test app-shell:check

      - name: Check and test the shared crates
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo test --workspace --all-features --locked

  axum:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the API
        run: moon generate axum -- --name api --port 4000

      - name: Check and test the API
        run: moon run api:check api:test

      - name: Build the production image
        run: moon run api:docker

  # An API generated with --database, tested against the data project's
  # PostgreSQL: api:test starts it through data:up.
  axum-database:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the data project and the API
        run: |
          moon generate postgres -- --name data --port 5433
          moon generate axum -- --name api --port 4000 --database
          cp services/api/.env.example services/api/.env

      - name: Check and test the API
        run: moon run api:check api:test

      - name: Build the production image
        run: moon run api:docker

  # An API generated with --database --events: its outbox is tested against the
  # data project's PostgreSQL, and an event goes through the bus project's NATS.
  axum-events:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the data project, the bus, and the API
        run: |
          moon generate postgres -- --name data --port 5433
          moon generate bus -- --name bus --port 4222
          moon generate axum -- --name api --port 4000 --database --events
          cp services/api/.env.example services/api/.env

      - name: Check and test the API
        run: moon run api:check api:test

      - name: Build the production image
        run: moon run api:docker

  # The object store: its bucket is created and takes a signed request.
  storage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate and start the object store
        run: |
          moon generate storage -- --name storage --port 9000
          moon run storage:up

  # Runs deploy/compose on the runner as the `local` environment, with
  # certificates from a local authority, the way deploy/compose/README.md
  # describes, and signs in through it.
  deploy:
    name: deploy (${{ matrix.template }})
    needs: ways
    if: needs.ways.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: [tanstack, next]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # `moon run` compares against main.
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the apps to deploy
        run: |
          moon generate ${{ matrix.template }} -- --name web --port 3000
          moon generate axum -- --name api --port 4000
          bun install

      - name: Deploy with setup
        run: bun run setup -- --compose local

      - name: Sign in through the deployed stack
        run: deploy/compose/smoke-test.sh

      # The Moon task finds the environment as setup left it, and changes nothing.
      - name: Run it again through Moon
        run: moon run deploy:local

      - name: Show the stack's logs
        if: failure()
        env:
          COMPOSE_FILE: deploy/compose/docker-compose.yml:deploy/compose/docker-compose.local.yml
        run: docker compose --env-file deploy/local/.env logs --tail 100 || true

  # A project with two web apps and two APIs: the overlays of deploy/local,
  # deploy/staging, and deploy/prod render, and every object matches the
  # Kubernetes schemas. A project renders the overlays it has.
  kubernetes:
    needs: ways
    if: needs.ways.outputs.kubernetes == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the apps
        run: |
          moon generate postgres -- --name data --port 5433
          moon generate bus -- --name bus --port 4222
          moon generate storage -- --name storage --port 9000
          moon generate tanstack -- --name web --port 3000
          moon generate next -- --name admin --port 3001 --no-include_demos
          moon generate axum -- --name api --port 4000 --database
          moon generate axum -- --name billing --port 4001 --database --events
          printf 'API_APP=api\n' >> apps/web/.env.example
          printf 'API_APP=api\nAPI_APPS=billing\n' >> apps/admin/.env.example

      - name: Write the manifests of every overlay
        run: |
          for environment in staging prod; do
            settings="deploy/$environment/settings.env"
            [ -e "$settings.example" ] || continue
            cp "$settings.example" "$settings"
            sed -i -e "s/^DOMAIN=.*/DOMAIN=$environment.acme.test/" -e 's|^IMAGE_REGISTRY=.*|IMAGE_REGISTRY=ghcr.io/acme/product|' "$settings"
          done
          for environment in local staging prod; do
            [ -e "deploy/$environment/kustomization.yaml" ] || continue
            bun run setup -- --kubernetes "$environment" --manifests-only
          done

      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render and validate every overlay
        run: |
          for environment in local staging prod; do
            [ -e "deploy/$environment/kustomization.yaml" ] || continue
            kubectl kustomize "deploy/$environment" > "$RUNNER_TEMP/$environment.yaml"
            kubeconform -strict -summary -kubernetes-version 1.34.0 "$RUNNER_TEMP/$environment.yaml"
          done
          if [ -e deploy/local/traefik.yaml ]; then
            kubeconform -strict -summary -kubernetes-version 1.34.0 deploy/local/traefik.yaml
          fi

  # The overlay of deploy/local on a kind cluster, the way deploy/base/README.md
  # describes it, and a sign-in through it.
  kubernetes-kind:
    name: kubernetes (kind)
    needs: ways
    if: needs.ways.outputs.kind == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Generate the apps to deploy
        run: |
          moon generate postgres -- --name data --port 5433
          moon generate tanstack -- --name web --port 3000
          moon generate axum -- --name api --port 4000 --database
          bun install

      - name: Install kind
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          chmod +x "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create the cluster and load the images
        run: deploy/local/local-cluster.sh

      - name: Deploy with setup
        run: bun run setup -- --kubernetes local

      - name: Sign in through the cluster
        run: deploy/local/smoke-test.sh

      - name: Show the cluster's state
        if: failure()
        run: |
          kubectl -n vern get pods,ingress -o wide || true
          kubectl -n vern describe pods || true
          kubectl -n vern logs deployment/zitadel --all-containers --tail=100 || true
          kubectl -n vern logs deployment/web --tail=100 || true
          kubectl -n vern logs deployment/api --all-containers --tail=100 || true
          kubectl -n traefik logs deployment/traefik --tail=100 || true

