# Serves the brand files under /brand and proxies / and /ui/v2/login to the
# Login App, with deploy/dev/auth-server/nginx.conf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-pages
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-pages
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: brand
              mountPath: /usr/share/nginx/html/brand
              readOnly: true
          readinessProbe:
            httpGet:
              path: /brand/favicon.svg
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: auth-pages-nginx
        - name: brand
          configMap:
            name: brand
---
apiVersion: v1
kind: Service
metadata:
  name: auth-pages
spec:
  selector:
    app.kubernetes.io/name: auth-pages
  ports:
    - name: http
      port: 80
      targetPort: http
