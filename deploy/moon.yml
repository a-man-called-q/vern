# The environments that run the whole product, one folder each: see
# deploy/README.md. `setup` runs an environment the way it was first set up,
# with Docker Compose or on Kubernetes (`bun run setup -- --compose <env>` or
# `--kubernetes <env>` says which, the first time).
tasks:
  local:
    command: bun scripts/setup.ts --env local
    description: Set up the rehearsal of production on this machine, with Docker Compose or on a kind cluster
    toolchains: system
    options:
      cache: false
      runFromWorkspaceRoot: true

  staging:
    command: bun scripts/setup.ts --env staging
    description: Set up or update the staging environment
    toolchains: system
    options:
      cache: false
      runFromWorkspaceRoot: true

  prod:
    command: bun scripts/setup.ts --env prod
    description: Set up or update the production environment
    toolchains: system
    options:
      cache: false
      runFromWorkspaceRoot: true
