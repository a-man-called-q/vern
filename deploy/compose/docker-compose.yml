# The whole product on one server: ZITADEL with the Vern sign-in pages, one web
# app, and one API behind Traefik with Let's Encrypt certificates. See
# deploy/compose/README.md. Every setting comes from the environment's file,
# deploy/<environment>/.env, and its secrets/ folder holds the API's key:
#   docker compose --env-file deploy/prod/.env -f deploy/compose/docker-compose.yml ...
name: vern

x-app-env: &issuer
  ZITADEL_ISSUER: https://${AUTH_DOMAIN:?Set AUTH_DOMAIN in deploy/<environment>/.env}
  ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}

services:
  traefik:
    image: traefik:v3.7.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=vern-edge
      - '--providers.docker.constraints=Label(`com.docker.compose.project`,`vern`)'
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in deploy/<environment>/.env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      edge:
        # Containers that call the public URLs reach Traefik directly.
        aliases:
          - ${AUTH_DOMAIN}
          - ${APP_DOMAIN:?Set APP_DOMAIN in deploy/<environment>/.env}
          - ${API_DOMAIN:?Set API_DOMAIN in deploy/<environment>/.env}

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:?Set ZITADEL_VERSION in deploy/<environment>/.env}
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkeyFromEnv
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?Set ZITADEL_MASTERKEY (32 characters) in deploy/<environment>/.env}
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: ${AUTH_DOMAIN}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://zitadel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/<environment>/.env}@postgres:5432/zitadel?sslmode=disable"

      ZITADEL_FIRSTINSTANCE_INSTANCENAME: ${ZITADEL_ORG_NAME:-Vern}
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-Vern}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-zitadel-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?Set ZITADEL_ADMIN_PASSWORD in deploy/<environment>/.env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"

      # Service account for `bun run setup -- --compose`.
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: vern-setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Vern setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"

      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Vern Login UI
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${AUTH_DOMAIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${AUTH_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${AUTH_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${AUTH_DOMAIN}/ui/v2/login/login?samlRequest=

      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_PRIMARYCOLOR: "#6D5EF5"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_BACKGROUNDCOLOR: "#F8FAFC"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_WARNCOLOR: "#E34D59"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_FONTCOLOR: "#172033"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_PRIMARYCOLORDARK: "#9A90FF"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_BACKGROUNDCOLORDARK: "#10121A"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_WARNCOLORDARK: "#FF7A86"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_FONTCOLORDARK: "#F6F7FB"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_HIDELOGINNAMESUFFIX: "true"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_DISABLEWATERMARK: "true"

      # Whether the sign-in page offers "Sign up". Applies only when ZITADEL
      # creates its database; `bun run setup -- --compose` brings an existing
      # instance in line.
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "${ZITADEL_ALLOW_REGISTER:-false}"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      - "traefik.http.routers.zitadel-api.rule=Host(`${AUTH_DOMAIN}`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/brand`) && !Path(`/`) && !Path(`/favicon.svg`)"
      - traefik.http.routers.zitadel-api.entrypoints=websecure
      - traefik.http.routers.zitadel-api.service=zitadel-api

  zitadel-login:
    image: ${ZITADEL_LOGIN_IMAGE:?Set ZITADEL_LOGIN_IMAGE in deploy/<environment>/.env}
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:${AUTH_DOMAIN},X-Forwarded-Proto:https
      VERN_BRAND_FILE: /brand/brand.json
    healthcheck:
      test: ["CMD-SHELL", "node /app/healthcheck.mjs http://127.0.0.1:3000/ui/v2/login/ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
      - ../dev/auth-server/brand:/brand:ro
    networks:
      - internal
    depends_on:
      zitadel-api:
        condition: service_healthy

  # Serves deploy/dev/auth-server/brand under /brand and sends / to the sign-in page.
  auth-server:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ../dev/auth-server/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../dev/auth-server/brand:/usr/share/nginx/html/brand:ro
    networks:
      - edge
      - internal
    depends_on:
      zitadel-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/brand/favicon.svg"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.services.auth-server.loadbalancer.server.port=80
      - "traefik.http.routers.auth-pages.rule=Host(`${AUTH_DOMAIN}`) && (Path(`/`) || PathPrefix(`/ui/v2/login`) || PathPrefix(`/brand`) || Path(`/favicon.svg`))"
      - traefik.http.routers.auth-pages.entrypoints=websecure
      - traefik.http.routers.auth-pages.service=auth-server

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U zitadel"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/<environment>/.env}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - internal

  # The web app from apps/${WEB_APP}. Copy this service for more web apps.
  web:
    build:
      context: ../..
      dockerfile: apps/${WEB_APP:?Set WEB_APP in deploy/<environment>/.env}/Dockerfile
    restart: unless-stopped
    environment:
      <<: *issuer
      APP_URL: https://${APP_DOMAIN}
      ZITADEL_CLIENT_ID: ${WEB_CLIENT_ID:-}
      SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # The app sends the user's access token only over HTTPS.
      API_BASE_URL: https://${API_DOMAIN}
    networks:
      - edge
      - internal
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.services.web.loadbalancer.server.port=3000
      - traefik.http.routers.web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.service=web

  # The API from services/${API_APP}. The web app calls it server-side with the
  # signed-in user's access token; it accepts only tokens ZITADEL confirms.
  api:
    build:
      context: ../../services/${API_APP:?Set API_APP in deploy/<environment>/.env}
    restart: unless-stopped
    environment:
      <<: *issuer
    secrets:
      - source: api-key
        target: zitadel-api-key.json
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.services.api.loadbalancer.server.port=4000
      - traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.service=api

secrets:
  api-key:
    # Written by `bun run setup -- --compose <environment>`.
    file: ../${DEPLOY_ENV:?Set DEPLOY_ENV in deploy/<environment>/.env}/secrets/api-key.json

networks:
  edge:
    name: vern-edge
  internal:
    internal: true

volumes:
  letsencrypt:
  postgres-data:
  redis-data:
  zitadel-bootstrap:
