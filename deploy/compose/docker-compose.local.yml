# Runs the stack on this machine (the `local` environment), with certificates
# from a local certificate authority instead of Let's Encrypt, and hostnames
# under localtest.me, which resolve to 127.0.0.1:
#   bun run setup -- --compose local
# creates deploy/local/.env and the certificates in deploy/local/certs/, and
# starts the stack with this file on top of docker-compose.yml. Browsers do not
# trust the local authority; import deploy/local/certs/ca.pem to avoid the
# warning.
services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=vern-edge
      - '--providers.docker.constraints=Label(`com.docker.compose.project`,`vern`)'
      - --providers.file.filename=/local/traefik-tls.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../local/certs:/local:ro

  web:
    environment:
      NODE_EXTRA_CA_CERTS: /local/ca.pem
    volumes:
      - ../local/certs:/local:ro

  api:
    environment:
      SSL_CERT_FILE: /local/ca.pem
    volumes:
      - ../local/certs:/local:ro
