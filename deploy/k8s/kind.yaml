# The cluster deploy/k8s/local-cluster.sh creates: ports 80 and 443 of this
# machine reach Traefik's NodePorts, so <name>.localtest.me (127.0.0.1) works
# in a browser.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
      - containerPort: 30443
        hostPort: 443
