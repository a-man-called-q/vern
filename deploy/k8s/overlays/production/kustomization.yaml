# The product on a production cluster. ZITADEL, the web apps, and the APIs run
# here; their databases do not. Create the Secrets deploy/k8s/README.md lists
# (zitadel-database, redis, and one per API that has a database or uses the
# bus) with your operator or managed services first. `bun run setup --
# --kubernetes production` writes `generated/` and applies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vern
resources:
  - ../../base
  - namespace.yaml
components:
  # The hostnames, images, settings, and Secrets of this project.
  - generated
