apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bus
    spec:
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
          ports:
            - name: nats
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bus
---
apiVersion: v1
kind: Service
metadata:
  name: bus
spec:
  selector:
    app.kubernetes.io/name: bus
  ports:
    - name: nats
      port: 4222
      targetPort: nats
