apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-db
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-db
    spec:
      containers:
        - name: postgres
          image: postgres:17.10-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: zitadel
            - name: POSTGRES_USER
              value: zitadel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-d", "zitadel", "-U", "zitadel"]
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zitadel-db
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-db
spec:
  selector:
    app.kubernetes.io/name: zitadel-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
