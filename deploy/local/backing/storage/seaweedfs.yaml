apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -volume.max=20
            - -master.volumeSizeLimitMB=512
          ports:
            - name: s3
              containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: 9333
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage
        - name: config
          secret:
            secretName: storage
            items:
              - key: s3.json
                path: s3.json
---
apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  selector:
    app.kubernetes.io/name: storage
  ports:
    - name: s3
      port: 8333
      targetPort: s3
