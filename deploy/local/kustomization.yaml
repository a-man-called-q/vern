# The whole product on a laptop cluster: ZITADEL's PostgreSQL, Redis, and the
# stacks under deploy/dev/ run in the cluster too, and the certificates come
# from a local authority. `bun run setup -- --kubernetes local` writes
# `generated/` and applies it; see deploy/base/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vern
resources:
  - ../base
  - namespace.yaml
  - backing/zitadel-db
  - backing/redis
components:
  # The hostnames, images, settings, and Secrets of this project.
  - generated
patches:
  # One replica of each app is enough on a laptop.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component in (web,api)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # The apps reach ZITADEL and the APIs over HTTPS, with the local authority's
  # certificates.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=web
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NODE_EXTRA_CA_CERTS
          value: /local-ca/ca.pem
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: local-ca
            mountPath: /local-ca
            readOnly: true
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: local-ca
            configMap:
              name: local-ca
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SSL_CERT_FILE
          value: /local-ca/ca.pem
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: local-ca
          mountPath: /local-ca
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: local-ca
          configMap:
            name: local-ca
