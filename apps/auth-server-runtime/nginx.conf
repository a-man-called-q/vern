worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  upstream zitadel_login {
    server zitadel-login:3000;
  }

  server {
    listen 80;
    server_name _;

    location /brand/ {
      alias /usr/share/nginx/html/brand/;
      add_header Cache-Control "public, max-age=3600" always;
    }

    location = /brand {
      return 301 /brand/;
    }

    location = /favicon.svg {
      alias /usr/share/nginx/html/brand/favicon.svg;
      default_type image/svg+xml;
    }

    location = / {
      proxy_pass http://zitadel_login/ui/v2/login;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Login V2 needs its original base path. The stylesheet injection keeps
    # the auth flow in the official image while allowing local brand changes.
    location ~ ^/ui/v2/login(/.*)?$ {
      proxy_pass http://zitadel_login;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
      proxy_set_header X-Forwarded-Prefix /ui/v2/login;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      sub_filter_types text/html;
      sub_filter_once on;
      sub_filter '<head>' '<head><link rel="stylesheet" href="/brand/login.css">';
    }

    location / {
      return 404;
    }
  }
}
