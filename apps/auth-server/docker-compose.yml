name: vern-auth

services:
  proxy:
    image: traefik:v3.7.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${AUTH_NETWORK_NAME:-vern-auth}
      - '--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-vern-auth}`)'
      - --entrypoints.web.address=:80
      - --ping=true
      - --ping.entrypoint=web
    ports:
      - "${AUTH_HTTP_PORT:-8081}:80"
    networks:
      - vern-auth
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
      auth-server:
        condition: service_healthy

  # Serves the brand assets under /brand and sends / to the Login App.
  auth-server:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./brand:/usr/share/nginx/html/brand:ro
    networks:
      - vern-auth
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/brand/favicon.svg"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${AUTH_NETWORK_NAME:-vern-auth}
      - traefik.http.services.auth-server.loadbalancer.server.port=80
      - "traefik.http.middlewares.auth-root-rewrite.replacepath.path=/ui/v2/login"
      - "traefik.http.routers.auth-root.rule=Host(`${ZITADEL_DOMAIN:-localhost}`) && Path(`/`)"
      - traefik.http.routers.auth-root.entrypoints=web
      - traefik.http.routers.auth-root.middlewares=auth-root-rewrite
      - traefik.http.routers.auth-root.service=auth-server
      - traefik.http.routers.auth-root.priority=400
      - "traefik.http.routers.auth-brand.rule=Host(`${ZITADEL_DOMAIN:-localhost}`) && (PathPrefix(`/brand`) || Path(`/favicon.svg`))"
      - traefik.http.routers.auth-brand.entrypoints=web
      - traefik.http.routers.auth-brand.service=auth-server
      - traefik.http.routers.auth-brand.priority=300
      - "traefik.http.routers.auth-login.rule=Host(`${ZITADEL_DOMAIN:-localhost}`) && PathPrefix(`/ui/v2/login`)"
      - traefik.http.routers.auth-login.entrypoints=web
      - traefik.http.routers.auth-login.service=auth-server
      - traefik.http.routers.auth-login.priority=250

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:?Set ZITADEL_VERSION in apps/auth-server/.env (see .env.example)}
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: "${ZITADEL_DOMAIN:-localhost}"
      ZITADEL_EXTERNALPORT: "${AUTH_HTTP_PORT:-8081}"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"

      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-zitadel}?sslmode=disable"

      ZITADEL_FIRSTINSTANCE_INSTANCENAME: "${ZITADEL_ORG_NAME:-Vern}"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: "${ZITADEL_ORG_NAME:-Vern}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: "${ZITADEL_ADMIN_USERNAME:-zitadel-admin}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_ADMIN_PASSWORD:-Password1!}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"

      # Service account for `bun run setup`, which creates the project, apps, and
      # keys. Its token is written next to the Login App's in the bootstrap volume.
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: vern-setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Vern setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "${LOGIN_CLIENT_PAT_EXPIRATION:-2099-01-01T00:00:00Z}"

      # Login V2 is served by the Login image below.
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Vern Login UI
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "${LOGIN_CLIENT_PAT_EXPIRATION:-2099-01-01T00:00:00Z}"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: "http://${ZITADEL_DOMAIN:-localhost}:${AUTH_HTTP_PORT:-8081}/ui/v2/login/"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: "http://${ZITADEL_DOMAIN:-localhost}:${AUTH_HTTP_PORT:-8081}/ui/v2/login/login?authRequest="
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: "http://${ZITADEL_DOMAIN:-localhost}:${AUTH_HTTP_PORT:-8081}/ui/v2/login/logout?post_logout_redirect="
      ZITADEL_SAML_DEFAULTLOGINURLV2: "http://${ZITADEL_DOMAIN:-localhost}:${AUTH_HTTP_PORT:-8081}/ui/v2/login/login?samlRequest="

      # Initial instance branding. FIRST/DEFAULTINSTANCE values are applied only
      # on the first database initialization.
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_PRIMARYCOLOR: "#6D5EF5"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_BACKGROUNDCOLOR: "#F8FAFC"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_WARNCOLOR: "#E34D59"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_FONTCOLOR: "#172033"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_PRIMARYCOLORDARK: "#9A90FF"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_BACKGROUNDCOLORDARK: "#10121A"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_WARNCOLORDARK: "#FF7A86"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_FONTCOLORDARK: "#F6F7FB"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_HIDELOGINNAMESUFFIX: "true"
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_DISABLEWATERMARK: "true"

      # Whether the sign-in page offers "Sign up". Off unless you opt in: in most
      # products an administrator creates the accounts. Like the branding above,
      # it applies only when ZITADEL creates its database; `bun run setup` brings
      # an existing instance in line.
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "${ZITADEL_ALLOW_REGISTER:-false}"

      # Outgoing email (verification, user initialization, invitations) goes to
      # Mailpit, a local inbox at http://localhost:${MAIL_UI_PORT:-8025}. Applied only
      # when ZITADEL creates its database; point production at a real SMTP server.
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: "mailpit:1025"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: "no-reply@${ZITADEL_DOMAIN:-localhost}"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: "${ZITADEL_ORG_NAME:-Vern}"

      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks:
      - vern-auth
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${AUTH_NETWORK_NAME:-vern-auth}
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.forceSlash=false
      - "traefik.http.routers.zitadel-api-alias.rule=Host(`${ZITADEL_DOMAIN:-localhost}`) && PathPrefix(`/api`)"
      - traefik.http.routers.zitadel-api-alias.entrypoints=web
      - traefik.http.routers.zitadel-api-alias.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api-alias.service=zitadel-api
      - traefik.http.routers.zitadel-api-alias.priority=200
      - "traefik.http.routers.zitadel-api.rule=Host(`${ZITADEL_DOMAIN:-localhost}`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/brand`) && !Path(`/`) && !Path(`/favicon.svg`)"
      - traefik.http.routers.zitadel-api.entrypoints=web
      - traefik.http.routers.zitadel-api.service=zitadel-api
      - traefik.http.routers.zitadel-api.priority=100

  zitadel-login:
    # Built from https://github.com/a-man-called-q/vern-zitadel-login; must match ZITADEL_VERSION.
    image: ${ZITADEL_LOGIN_IMAGE:?Set ZITADEL_LOGIN_IMAGE in apps/auth-server/.env (see .env.example)}
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: "Host:${ZITADEL_DOMAIN:-localhost},X-Forwarded-Proto:http"
      # Text and images of the sign-in shell; edits apply on the next page load.
      VERN_BRAND_FILE: /brand/brand.json
    healthcheck:
      test: ["CMD-SHELL", "node /app/healthcheck.mjs http://127.0.0.1:3000/ui/v2/login/ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
      - ./brand:/brand:ro
    networks:
      - vern-auth
    depends_on:
      zitadel-api:
        condition: service_healthy

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-zitadel}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-zitadel} -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    networks:
      - vern-auth

  # A local inbox for the email ZITADEL sends. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - vern-auth

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - vern-auth

networks:
  vern-auth:
    name: ${AUTH_NETWORK_NAME:-vern-auth}

volumes:
  postgres-data:
  zitadel-bootstrap:
