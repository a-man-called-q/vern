tasks:
  dev:
    command: docker compose --env-file .env -f docker-compose.yml up -d --wait
    description: Start local ZITADEL, PostgreSQL, and Redis containers
    deps:
      - 'workspace:check-ports'
    toolchains: system
    options:
      cache: false
      envFile: true
      persistent: false

  down:
    command: docker compose --env-file .env -f docker-compose.yml down
    description: Stop local auth and Redis containers while keeping volumes
    toolchains: system
    options:
      cache: false
      envFile: true
