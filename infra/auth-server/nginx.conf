worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Behind a TLS-terminating proxy, keep the scheme the browser used.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  upstream zitadel_login {
    server zitadel-login:3000;
  }

  server {
    listen 80;
    server_name _;

    location /brand/ {
      alias /usr/share/nginx/html/brand/;
      # Revalidate on every load (nginx sends an ETag), so an edit to a logo or
      # backdrop shows on the next page load instead of up to an hour later.
      add_header Cache-Control "no-cache" always;
    }

    location = /brand {
      return 301 /brand/;
    }

    location = /favicon.svg {
      alias /usr/share/nginx/html/brand/favicon.svg;
      default_type image/svg+xml;
    }

    location = / {
      proxy_pass http://zitadel_login/ui/v2/login;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Login V2 needs its original base path; keep the incoming path intact.
    location ~ ^/ui/v2/login(/.*)?$ {
      proxy_pass http://zitadel_login;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
      proxy_set_header X-Forwarded-Prefix /ui/v2/login;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
    }

    location / {
      return 404;
    }
  }
}
