# The APIs' own data, separate from the PostgreSQL that ZITADEL uses in
# deploy/dev/auth-server. The project name includes the repository folder, so two
# projects on one machine do not share a volume.
name: {{ workspace_root | split(pat="/") | last | kebab_case }}-{{ name | kebab_case }}

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    # PORT is what scripts/check-ports.ts reads, so it also checks this service.
    ports:
      - "127.0.0.1:${PORT:-{{ port }}}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw

volumes:
  postgres-data:
