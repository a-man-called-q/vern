tasks:
  dev:
    command: bun run dev
    description: Run this TanStack dashboard in development mode
    deps:
      - 'workspace:install'
      - 'auth-server:up'
    toolchains: system
    preset: server

  build:
    command: bun run build
    description: Build this TanStack dashboard
    deps:
      - 'workspace:install'
      - 'ui:build'
    toolchains: system

  check:
    command: bun run check
    description: Type-check this TanStack dashboard
    deps:
      - 'workspace:install'
    toolchains: system

  test:
    command: bun run test
    description: Run this TanStack dashboard's tests
    deps:
      - 'workspace:install'
    toolchains: system

  docker:
    command: docker build -f apps/{{ name | kebab_case }}/Dockerfile -t {{ name | kebab_case }} .
    description: Build this app's production Docker image
    toolchains: system
    options:
      cache: false
      runFromWorkspaceRoot: true
