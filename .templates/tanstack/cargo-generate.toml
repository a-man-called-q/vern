[template]
cargo_generate_version = ">=0.23.0"
ignore = [
  "cargo-generate.toml",
  "node_modules",
  "node_modules/**",
  ".tanstack",
  ".cta.json",
  ".env",
  "*.local",
  "dist",
  "dist-ssr",
  "src/routeTree.gen.ts",
]
include = [
  "package.json",
  "package.json.liquid",
  "README.md",
  "README.md.liquid",
  "src/components/Header.tsx",
  "src/components/Header.tsx.liquid",
  "src/routes/__root.tsx",
  "src/routes/__root.tsx.liquid",
]

[placeholders.include_demos]
type = "bool"
prompt = "Include demo routes and examples?"
default = true

[conditional.'include_demos == false']
ignore = [
  "src/routes/demo",
  "src/components/demo.FormComponents.tsx",
  "src/data/demo-table-data.ts",
  "src/hooks/demo.form.ts",
  "src/hooks/demo.form-context.ts",
]
