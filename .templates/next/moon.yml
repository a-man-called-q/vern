tasks:
  dev:
    command: bun run dev
    description: Run this Next.js app in development mode
    deps:
      - 'workspace:install'
      - 'auth-server:up'
    toolchains: system
    preset: server

  build:
    command: bun run build
    description: Build this Next.js app
    deps:
      - 'workspace:install'
      - 'ui:build'
    toolchains: system
    # The shared packages are compiled from source with the app.
    inputs:
      - '**/*'
      - '/packages/*/src/**/*'
      - '/packages/*/package.json'
    options:
      # `next build` recreates .next while `check` type-checks .next/types.
      mutex: '{{ name | kebab_case }}-next-dir'

  check:
    command: bun run check
    description: Type-check and lint this Next.js app
    deps:
      - 'workspace:install'
    toolchains: system
    # The shared packages are compiled from source with the app.
    inputs:
      - '**/*'
      - '/packages/*/src/**/*'
      - '/packages/*/package.json'
    options:
      mutex: '{{ name | kebab_case }}-next-dir'

  test:
    command: bun run test
    description: Run this Next.js app's tests
    deps:
      - 'workspace:install'
    toolchains: system
    # The shared packages are compiled from source with the app.
    inputs:
      - '**/*'
      - '/packages/*/src/**/*'
      - '/packages/*/package.json'

  docker:
    command: docker build -f apps/{{ name | kebab_case }}/Dockerfile -t {{ name | kebab_case }} .
    description: Build this app's production Docker image
    toolchains: system
    options:
      cache: false
      runFromWorkspaceRoot: true
