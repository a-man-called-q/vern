tasks:
  dev:
    command: cargo run
    description: Run this Axum service in development mode
    deps:
      - 'auth-server:dev'
{%- if database %}
      - 'data:up'
{%- endif %}
    toolchains: system
    preset: server

  build:
    command: cargo build --release
    description: Build this Axum service for release
    toolchains: system

  check:
    command: cargo check
    description: Check this Axum service
    toolchains: system

  test:
    command: cargo test
    description: Run this Axum service's tests
{%- if database %}
    deps:
      - 'data:up'
{%- endif %}
    toolchains: system

  docker:
    command: docker build -t {{ name | kebab_case }} .
    description: Build this API's production Docker image
    toolchains: system
    options:
      cache: false
