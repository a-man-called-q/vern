title: Axum API
description: Generate a Rust Axum API that validates ZITADEL access tokens.
destination: '/services/[name | kebab_case]'
variables:
  name:
    type: string
    default: axum
    required: true
    prompt: Axum project name?
  port:
    type: number
    required: true
    prompt: Unique local port (1024-65535) for this Axum API?
  database:
    type: boolean
    default: false
    prompt: Add a PostgreSQL database? It needs the data project (moon generate postgres).
  events:
    type: boolean
    default: false
    prompt: Send and receive events over NATS (needs --database and the bus project, moon generate bus)?
