title: Axum service
description: Generate a Rust Axum API that validates ZITADEL access tokens.
destination: '/apps/[name | kebab_case]'
variables:
  name:
    type: string
    default: service
    required: true
    prompt: Service project name?
  port:
    type: number
    required: true
    prompt: Unique local port (1024-65535) for this service?
