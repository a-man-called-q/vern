# An S3-compatible object store for uploads. SeaweedFS runs its master, volume
# server, filer, and S3 gateway in this one container. The project name includes
# the repository folder, so two projects on one machine do not share a volume.
name: {{ workspace_root | split(pat="/") | last | kebab_case }}-{{ name | kebab_case }}

services:
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # -s3.allowedOrigins lets the browser upload straight to a presigned URL
    # from the web apps, which are on other ports.
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.allowedOrigins=${S3_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3003}
      - -volume.max=20
      - -master.volumeSizeLimitMB=512
    # PORT is what scripts/check-ports.ts reads, so it also checks this service.
    ports:
      - "127.0.0.1:${PORT:-{{ port }}}:8333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null &&
          wget -S -qO- http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1'
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data:rw

volumes:
  s3-data:
