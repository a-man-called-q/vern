title: TanStack dashboard
description: Generate a TanStack Start dashboard with OIDC login and server-side API calls.
destination: '/apps/[name | kebab_case]'
variables:
  name:
    type: string
    default: dashboard
    required: true
    prompt: Dashboard project name?
  port:
    type: number
    required: true
    prompt: Unique local port (1024-65535) for this dashboard?
  include_demos:
    type: boolean
    default: true
    prompt: Include demo routes and examples?
