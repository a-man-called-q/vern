title: TanStack app
description: Generate a TanStack Start app with OIDC login and server-side API calls.
destination: '/apps/[name | kebab_case]'
# Adds the files both web templates share (.vern/templates/web-base); a file of
# this template at the same path replaces the shared one.
extends: ['web-base']
variables:
  name:
    type: string
    default: tanstack
    required: true
    prompt: TanStack project name?
  port:
    type: number
    required: true
    prompt: Unique local port (1024-65535) for this TanStack app?
  include_demos:
    type: boolean
    default: true
    prompt: Include demo routes and examples?
