tasks:
  check:
    command: cargo check --all-targets --all-features
    description: Check the shared crate for the outbox and the bus
    toolchains: system
    inputs:
      - '**/*'
      - '/Cargo.toml'
      - '/Cargo.lock'

  # The tests that need PostgreSQL or NATS are marked `#[ignore]`: a crate has
  # no settings of its own. An API generated with a database or events runs
  # them in its `test` task, with its DATABASE_URL and NATS_URL.
  test:
    command: cargo test --all-features
    description: Run the tests of the shared crate for the outbox and the bus
    toolchains: system
    inputs:
      - '**/*'
      - '/Cargo.toml'
      - '/Cargo.lock'
