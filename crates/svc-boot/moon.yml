tasks:
  check:
    command: cargo check --all-targets --all-features
    description: Check the shared crate for startup and shutdown
    toolchains: system
    inputs:
      - '**/*'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    command: cargo test --all-features
    description: Run the tests of the shared crate for startup and shutdown
    toolchains: system
    inputs:
      - '**/*'
      - '/Cargo.toml'
      - '/Cargo.lock'
