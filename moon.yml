tasks:
  install:
    command: bun install
    description: Install all Bun workspace dependencies
    toolchains: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  check-ports:
    command: bun scripts/check-ports.ts
    description: Check local service ports for conflicts
    toolchains: system
    inputs:
      - 'apps/*/.env'
      - 'apps/*/.env.example'
      - 'services/*/.env'
      - 'services/*/.env.example'
      - 'deploy/dev/*/.env'
      - 'deploy/dev/*/.env.example'
      - '.env'
      - '.env.example'
    options:
      cache: false
      runFromWorkspaceRoot: true
