tasks:
  dashboard:
    command: bun scripts/generate-tanstack.ts
    description: Generate a TanStack Start app under apps/<name>
    toolchains: system
    inputs:
      - '.templates/tanstack/**/*'
      - 'scripts/generate-tanstack.ts'
    options:
      interactive: true

  process:
    command: cargo generate --path .templates/axum
    description: Generate the Axum process API
    toolchains: system
    inputs: []
    options:
      interactive: true
