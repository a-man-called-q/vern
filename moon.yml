tasks:
  install:
    command: bun install
    description: Install all Bun workspace dependencies
    toolchains: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  check-ports:
    command: bun run vern check-ports
    description: Check local service ports for conflicts
    # The check is a command of @vern/cli, which `bun install` puts in
    # node_modules: a project with only APIs has no other task that installs.
    deps:
      - '~:install'
    toolchains: system
    inputs:
      - 'apps/*/.env'
      - 'apps/*/.env.example'
      - 'services/*/.env'
      - 'services/*/.env.example'
      - 'deploy/dev/*/.env'
      - 'deploy/dev/*/.env.example'
      - '.env'
      - '.env.example'
    options:
      cache: false
      runFromWorkspaceRoot: true
