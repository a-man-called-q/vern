tasks:
  build:
    command: bun run check
    description: Type-check the source-only shared UI package
    deps:
      - 'workspace:install'
    toolchains: system
    inputs:
      - 'src/**/*'
      - 'package.json'
      - 'tsconfig.json'

  check:
    command: bun run check
    description: Type-check the shared UI package
    deps:
      - 'workspace:install'
    toolchains: system
    inputs:
      - 'src/**/*'
      - 'package.json'
      - 'tsconfig.json'
