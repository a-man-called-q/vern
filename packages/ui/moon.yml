tasks:
  install:
    command: bun install
    description: Install Bun workspace dependencies
    toolchains: system
    inputs: []
    options:
      cache: false
      runFromWorkspaceRoot: true

  check:
    command: bun run check
    description: Type-check the shared UI package
    deps:
      - '~:install'
    toolchains: system
    inputs:
      - 'src/**/*'
      - 'package.json'
      - 'tsconfig.json'
